<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexlstream</title>
  <link rel="icon" type="image/jpg" href="assets/unnamed.jpg">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Library Plyr Player (CSS & JS) -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

  <style>
    /* ========== TEMA & VARIABEL (MONOCHROME BLUE) ========== */
    :root {
      --bg-color: #090b10;
      --bg-secondary: #0e1117;
      --surface-color: #151922;
      --surface-hover: #1e2430;
      --surface-light: #252d3a;
      --text-main: #e0e4ec;
      --text-muted: #6b7a90;
      --accent: #234381;
      --accent-dim: rgba(91, 141, 239, 0.12);
      --accent-glow: rgba(91, 141, 239, 0.25);
      --card-bg: #111720;
      --card-border: rgba(255,255,255,0.05);
      --border-subtle: rgba(255,255,255,0.07);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
      --shadow-elevated: 0 8px 32px rgba(0,0,0,0.6);
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(91,141,239,0.04) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

    /* ========== HEADER ========== */
    header {
      position: sticky; top: 0; z-index: 100; width: 100%; padding: 15px 0;
      background: rgba(9, 11, 16, 0.88);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      text-align: center;
      border-bottom: 1px solid rgba(91, 141, 239, 0.15);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    header:hover { border-bottom-color: rgba(91, 141, 239, 0.35); }
    header h1 {
      margin: 0; font-size: 1.25rem; font-weight: 800;
      letter-spacing: 4px; text-transform: uppercase; color: var(--accent);
    }

    /* ========== CONTAINER ========== */
    .container {
      position: relative; z-index: 1;
      max-width: 1200px; width: 92%; margin: 0 auto; padding: 28px 0 60px;
    }

    /* ========== TRANSITIONS ========== */
    #view-home, #view-detail, #view-streaming { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ========== SECTION TITLE ========== */
    .section-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
    .section-subtitle { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; }

    /* ========== SEARCH BAR ========== */
    .search-wrap {
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%; max-width: 360px;
      padding: 9px 14px; 
      background: var(--surface-color); color: var(--text-main);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: 0.82rem;
      outline: none; transition: border-color var(--transition-fast);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent); }

    /* ========== CONTINUE WATCHING ========== */
    .cw-section { margin-bottom: 22px; }
    .cw-label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .cw-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface-color); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 10px 14px;
      cursor: pointer; transition: all var(--transition-fast);
      overflow: hidden;
    }
    .cw-card:hover { border-color: var(--accent); background: var(--surface-hover); }
    .cw-poster { width: 40px; height: 60px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    .cw-info { flex: 1; min-width: 0; }
    .cw-title { font-size: 0.82rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cw-ep { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cw-play {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; cursor: pointer;
    }

    /* ========== ANIME GRID ========== */
    .anime-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px; padding: 0; margin-top: 8px;
    }
    .anime-card {
      background: var(--card-bg); border-radius: var(--radius-md);
      overflow: hidden; cursor: pointer;
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth);
      display: flex; flex-direction: column;
      border: 1px solid var(--card-border); position: relative;
    }
    .anime-card::after {
      content: ''; position: absolute; inset: 0; border-radius: var(--radius-md);
      opacity: 0; background: linear-gradient(180deg, transparent 55%, rgba(91,141,239,0.06) 100%);
      transition: opacity var(--transition-smooth); pointer-events: none;
    }
    .anime-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 35px rgba(0,0,0,0.45), 0 0 15px rgba(91,141,239,0.06); border-color: rgba(91,141,239,0.12); }
    .anime-card:hover::after { opacity: 1; }

    .anime-cover-wrapper { width: 100%; aspect-ratio: 2/3; position: relative; background: #080c14; overflow: hidden; }
    .anime-cover-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); }
    .anime-card:hover .anime-cover-wrapper img { transform: scale(1.06); }
    .anime-cover-wrapper::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(to top, var(--card-bg), transparent); pointer-events: none;
    }

    /* Progress badge */
    .card-badge {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      background: rgba(9,11,16,0.85); color: var(--accent);
      font-size: 0.62rem; font-weight: 700;
      padding: 3px 7px; border-radius: 4px;
      backdrop-filter: blur(6px);
    }

    .anime-info { padding: 11px 13px 13px; }
    .anime-title {
      font-size: 0.85rem; font-weight: 700; margin-bottom: 3px; color: var(--text-main);
      line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .anime-genre { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }

    /* ========== MOBILE ========== */
    @media (max-width: 600px) {
      .container { width: 95%; padding: 16px 0 32px; }
      .anime-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .anime-info { padding: 7px 9px 9px; }
      .anime-title { font-size: 0.72rem; }
      .anime-genre { font-size: 0.62rem; }
      .card-badge { font-size: 0.55rem; padding: 2px 5px; top: 5px; right: 5px; }
      header { padding: 11px 0; }
      header h1 { font-size: 1rem; letter-spacing: 3px; }
      .section-title { font-size: 1.1rem; }
      .search-input { max-width: 100%; font-size: 0.78rem; padding: 8px 12px; }
      .cw-card { padding: 8px 10px; gap: 10px; }
      .cw-poster { width: 34px; height: 50px; }
      .cw-title { font-size: 0.75rem; }
      .cw-ep { font-size: 0.65rem; }
      .cw-play { width: 28px; height: 28px; font-size: 0.6rem; }
      .detail-layout { flex-direction: column !important; align-items: center; }
      .detail-poster-wrap { width: 170px !important; }
      .detail-info-wrap { min-width: unset !important; }
      .player-anime-title { font-size: 1.1rem !important; }
      .player-controls-bottom { gap: 8px; }
      .player-controls-bottom .btn-action { padding: 7px 12px; font-size: 0.72rem; }
    }

    /* ========== BUTTONS ========== */
    .btn-action {
      background-color: var(--surface-color); color: var(--text-muted);
      border: 1px solid var(--border-subtle); padding: 9px 20px;
      border-radius: var(--radius-sm); cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
      transition: all var(--transition-fast);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-action:hover:not(:disabled) { background-color: var(--surface-hover); border-color: var(--accent); color: var(--accent); }
    .btn-action:active:not(:disabled) { transform: scale(0.97); }
    .btn-action:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-back {
      background: transparent; color: var(--text-muted); border: none; padding: 8px 4px;
      cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
      transition: all var(--transition-fast); display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-back:hover { color: var(--accent); }

    /* ========== PLAYER ========== */
    .player-nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .player-header { margin-bottom: 14px; }
    .player-anime-title { font-size: 1.4rem; font-weight: 700; line-height: 1.3; color: var(--text-main); }

    .video-wrapper {
      position: relative;
      width: 100%; max-width: 960px; margin: 0 auto;
      border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: var(--shadow-elevated); background-color: #000;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .plyr, .plyr__video-wrapper, video { -webkit-tap-highlight-color: transparent !important; outline: none !important; }
    .plyr { border-radius: var(--radius-lg); width: 100% !important; }
    .plyr--fullscreen-active {
      border-radius: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    .plyr--fullscreen-active video {
      object-fit: contain !important;
    }
    .plyr--full-ui input[type=range] { color: var(--accent) !important; }
    .plyr__control--overlaid { background: var(--accent) !important; color: #fff !important; }
    .plyr__control:hover { background: var(--accent) !important; color: #fff !important; }

    .player-controls-bottom {
      display: flex; justify-content: space-between;
      margin-top: 14px; max-width: 960px; margin-left: auto; margin-right: auto;
    }

    /* ========== AUTO-PLAY NEXT OVERLAY ========== */
    .autoplay-overlay {
      position: absolute; bottom: 60px; right: 16px; z-index: 50;
      background: rgba(9,11,16,0.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(91,141,239,0.2); border-radius: var(--radius-md);
      padding: 12px 16px; display: none; align-items: center; gap: 10px;
      animation: fadeIn 0.3s ease-out;
    }
    .autoplay-overlay.show { display: flex; }
    .autoplay-text { font-size: 0.78rem; color: var(--text-muted); }
    .autoplay-text strong { color: var(--text-main); }
    .autoplay-countdown {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 800; flex-shrink: 0;
    }
    .autoplay-cancel {
      background: transparent; border: 1px solid var(--border-subtle);
      color: var(--text-muted); padding: 4px 10px; border-radius: 4px;
      cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.7rem;
      transition: all var(--transition-fast);
    }
    .autoplay-cancel:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 600px) {
      .autoplay-overlay { bottom: 50px; right: 8px; left: 8px; padding: 10px 12px; gap: 8px; }
      .autoplay-text { font-size: 0.7rem; }
      .autoplay-countdown { width: 26px; height: 26px; font-size: 0.72rem; }
    }

    /* ========== SERVER BUTTONS ========== */
    .server-container {
      background-color: var(--surface-color); padding: 14px 18px;
      border-radius: var(--radius-md); border: 1px solid var(--border-subtle);
      max-width: 960px; margin-left: auto; margin-right: auto;
    }
    .server-label { font-weight: 700; font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 12px; }
    .server-btn {
      background-color: rgba(255,255,255,0.04); color: var(--text-muted);
      border: 1px solid var(--border-subtle); padding: 7px 14px; border-radius: 6px;
      cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.78rem; font-weight: 600;
      transition: all var(--transition-fast);
    }
    .server-btn:hover { background-color: rgba(255,255,255,0.08); color: var(--text-main); }
    .server-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; box-shadow: 0 0 10px rgba(91,141,239,0.2); }

    /* ========== DETAIL PAGE ========== */
    .detail-layout { display: flex; gap: 28px; flex-wrap: wrap; }
    .detail-poster-wrap { width: 210px; flex-shrink: 0; }
    .detail-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: var(--radius-md); box-shadow: var(--shadow-card); border: 1px solid var(--border-subtle); }
    .detail-info-wrap { flex: 1; min-width: 270px; }
    .detail-anime-title { font-size: 1.5rem; font-weight: 800; margin: 0 0 6px; line-height: 1.2; }
    .detail-meta { color: var(--accent); font-size: 0.85rem; font-weight: 500; margin-bottom: 22px; opacity: 0.85; }
    .episode-list-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .episode-list-scroll { max-height: 420px; overflow-y: auto; padding-right: 4px; }

    .ep-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 11px 14px; margin-bottom: 5px;
      background: rgba(255,255,255,0.025); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm); color: var(--text-main);
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all var(--transition-fast); text-align: left;
    }
    .ep-btn:hover { background: var(--accent-dim); border-color: rgba(91,141,239,0.2); color: var(--accent); }
    .ep-btn.watched { color: var(--text-muted); opacity: 0.5; font-weight: 500; }
    .ep-btn.watched:hover { opacity: 0.75; }

    .ep-icon {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 0.65rem;
    }
    .ep-icon.play { background: var(--accent-dim); color: var(--accent); }
    .ep-icon.check { background: rgba(107,122,144,0.15); color: var(--text-muted); }
    .ep-no-data { color: var(--text-muted); font-style: italic; padding: 14px 0; }

    /* ========== KEYBOARD HINT (DESKTOP ONLY) ========== */
    .kbd-hint {
      position: fixed; bottom: 16px; right: 16px; z-index: 90;
      background: rgba(9,11,16,0.9); backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      padding: 8px 12px; font-size: 0.65rem; color: var(--text-muted);
      display: none; gap: 8px; flex-wrap: wrap; max-width: 280px;
    }
    .kbd-hint kbd {
      background: var(--surface-hover); padding: 2px 6px; border-radius: 3px;
      font-family: 'Inter', monospace; font-size: 0.62rem; color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }
    @media (min-width: 769px) {
      .kbd-hint.visible { display: flex; }
    }
  </style>
</head>
<body>

  <header onclick="navigateToHome()">
    <h1>Vexlstream</h1>
  </header>

  <div class="container">
    
    <!-- 1. HOME -->
    <div id="view-home">
      <div class="section-title">Koleksi Anime</div>
      <div class="section-subtitle">Pilih judul untuk melihat daftar episode</div>
      
      <!-- Continue Watching -->
      <div id="cw-section" class="cw-section" style="display:none;"></div>

      <!-- Search -->
      <div class="search-wrap">
        <input class="search-input" id="search-input" type="text" placeholder="Cari anime..." oninput="filterAnime(this.value)">
      </div>

      <div class="anime-grid" id="anime-list-container"></div>
    </div>

    <!-- 2. DETAIL -->
    <div id="view-detail" style="display: none;">
      <div class="player-nav-top">
        <button class="btn-back" onclick="navigateToHome()">← Kembali</button>
      </div>
      <div id="anime-detail-content" style="margin-top: 10px;"></div>
    </div>

    <!-- 3. STREAMING -->
    <div id="view-streaming" style="display: none;">
      <div class="player-nav-top">
        <button class="btn-back" onclick="navigateToDetail()">← Kembali</button>
      </div>
      
      <div class="player-header">
        <div id="streaming-title" class="player-anime-title"></div>
      </div>

      <div class="video-wrapper">
        <video id="main-player" controls playsinline preload="metadata"></video>
        <!-- Auto-play next overlay -->
        <div id="autoplay-overlay" class="autoplay-overlay">
          <div class="autoplay-countdown" id="autoplay-countdown">5</div>
          <div class="autoplay-text">Episode berikutnya dalam <strong id="autoplay-sec">5</strong>s</div>
          <button class="autoplay-cancel" onclick="cancelAutoplay()">Batal</button>
        </div>
      </div>

      <div class="player-controls-bottom">
        <button id="btn-prev" class="btn-action" onclick="playPrevEpisode()">⏮ Sebelumnya</button>
        <button id="btn-next" class="btn-action" onclick="playNextEpisode()">Selanjutnya ⏭</button>
      </div>

      <div id="server-options" class="server-container" style="display: none; margin-top: 15px;">
        <span class="server-label">Server:</span>
        <div id="server-buttons" style="display: inline-flex; gap: 8px; flex-wrap: wrap;"></div>
      </div>
    </div>

  </div>

  <!-- Keyboard Shortcuts Hint (desktop only) -->
  <div id="kbd-hint" class="kbd-hint">
    <span><kbd>Space</kbd> Play/Pause</span>
    <span><kbd>←</kbd><kbd>→</kbd> Seek</span>
    <span><kbd>N</kbd> Next</span>
    <span><kbd>F</kbd> Fullscreen</span>
  </div>

  <script src="catalog.js"></script>
  
  <script>
    // ==========================================
    // GLOBAL STATE
    // ==========================================
    let currentAnimeId = null;
    let currentEpisodeIndex = null;
    let player = null;
    let autoplayTimer = null;
    let autoplaySeconds = 5;
    let resumeThrottleTimer = null;

    // ==========================================
    // 1. RENDER HOME
    // ==========================================
    function renderHome() {
      const container = document.getElementById('anime-list-container');
      if (!container) return;
      container.innerHTML = '';

      ANIME_CATALOG.forEach(anime => {
        // Hitung progress: berapa episode sudah ditonton
        let watchedCount = 0;
        anime.episodes.forEach(ep => {
          const tid = ep.fileId || (ep.sources && ep.sources[0] ? ep.sources[0].fileId || ep.sources[0].url : null);
          if (tid && localStorage.getItem(`watched_${tid}`) === 'true') watchedCount++;
        });
        const totalEps = anime.episodes.length;
        const badgeHtml = watchedCount > 0
          ? `<div class="card-badge">${watchedCount}/${totalEps}</div>`
          : '';

        container.innerHTML += `
          <div class="anime-card" data-title="${anime.title.toLowerCase()}" onclick="selectAnime('${anime.id}')">
            <div class="anime-cover-wrapper">
              ${badgeHtml}
              <img src="${anime.cover}" alt="${anime.title}" loading="lazy">
            </div>
            <div class="anime-info">
              <div class="anime-title">${anime.title}</div>
              <span class="anime-genre">${anime.meta.split('•')[0]}</span>
            </div>
          </div>
        `;
      });
    }

    // ==========================================
    // CONTINUE WATCHING SECTION
    // ==========================================
    function renderContinueWatching() {
      const section = document.getElementById('cw-section');
      const cwAnimeId = localStorage.getItem('cw_animeId');
      const cwEpIndex = localStorage.getItem('cw_epIndex');

      if (!cwAnimeId || cwEpIndex === null) {
        section.style.display = 'none';
        return;
      }

      const anime = ANIME_CATALOG.find(a => a.id === cwAnimeId);
      if (!anime) { section.style.display = 'none'; return; }

      const epIdx = parseInt(cwEpIndex, 10);
      const ep = anime.episodes[epIdx];
      if (!ep) { section.style.display = 'none'; return; }

      // Ambil timestamp resume
      const resumeKey = `resume_${cwAnimeId}_${epIdx}`;
      const savedTime = parseFloat(localStorage.getItem(resumeKey)) || 0;
      const timeStr = savedTime > 0 ? ` • ${formatTime(savedTime)}` : '';

      section.style.display = 'block';
      section.innerHTML = `
        <div class="cw-label">Lanjutkan</div>
        <div class="cw-card" onclick="resumeWatching('${cwAnimeId}', ${epIdx})">
          <img class="cw-poster" src="${anime.cover}" alt="${anime.title}">
          <div class="cw-info">
            <div class="cw-title">${anime.title}</div>
            <div class="cw-ep">${ep.title}${timeStr}</div>
          </div>
          <button class="cw-play" onclick="event.stopPropagation(); resumeWatching('${cwAnimeId}', ${epIdx})">▶</button>
        </div>
      `;
    }

    function resumeWatching(animeId, epIndex) {
      currentAnimeId = animeId;
      localStorage.setItem('currentAnimeId', animeId);
      history.pushState({ view: 'view-detail', animeId }, '', '#detail');
      renderDetail(animeId);
      startStreaming(epIndex);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // ==========================================
    // SEARCH / FILTER
    // ==========================================
    function filterAnime(query) {
      const q = query.toLowerCase().trim();
      document.querySelectorAll('.anime-card').forEach(card => {
        const title = card.getAttribute('data-title') || '';
        card.style.display = title.includes(q) ? '' : 'none';
      });
    }

    // ==========================================
    // 2. NAVIGASI & STREAMING
    // ==========================================
    function selectAnime(animeId) {
      currentAnimeId = animeId;
      localStorage.setItem('currentAnimeId', animeId);
      localStorage.removeItem('lastViewedEpisode');
      history.pushState({ view: 'view-detail', animeId }, '', '#detail');
      showView('view-detail');
      renderDetail(animeId);
    }

    function playSource(source) {
      let streamUrl = "";
      if (source.fileId) streamUrl = `/api/stream?fileId=${source.fileId}`;
      else if (source.url) streamUrl = source.url;

      if (!player) initPlyr();

      player.source = { type: 'video', sources: [{ src: streamUrl, type: 'video/mp4' }] };
      player.play().catch(err => console.log("Autoplay dicegah browser:", err));
    }

    // ==========================================
    // ORIENTATION HELPER (HORIZONTAL ON FULLSCREEN)
    // ==========================================
    async function lockLandscape() {
      try {
        if (screen.orientation && typeof screen.orientation.lock === 'function') {
          await screen.orientation.lock('landscape');
        } else if (screen.lockOrientation) {
          screen.lockOrientation('landscape');
        } else if (screen.mozLockOrientation) {
          screen.mozLockOrientation('landscape');
        } else if (screen.msLockOrientation) {
          screen.msLockOrientation('landscape');
        }
      } catch (err) {
        console.warn('Orientation lock notice:', err);
      }
    }

    function unlockOrientation() {
      try {
        if (screen.orientation && typeof screen.orientation.unlock === 'function') {
          screen.orientation.unlock();
        } else if (screen.unlockOrientation) {
          screen.unlockOrientation();
        } else if (screen.mozUnlockOrientation) {
          screen.mozUnlockOrientation();
        } else if (screen.msUnlockOrientation) {
          screen.msUnlockOrientation();
        }
      } catch (err) {
        console.warn('Orientation unlock notice:', err);
      }
    }

    function initPlyr() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const videoEl = document.getElementById('main-player');

      player = new Plyr('#main-player', {
        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'settings', 'pip', 'fullscreen'],
        seekTime: 5, clickToPlay: true, doubleClickDelay: 0,
        fullscreen: { enabled: true, fallback: true, iosNative: true }
      });

      // ---- AUTO HORIZONTAL / LANDSCAPE SAAT FULLSCREEN ----
      player.on('enterfullscreen', () => {
        lockLandscape();
        setTimeout(lockLandscape, 100);
      });

      player.on('exitfullscreen', () => {
        unlockOrientation();
      });

      // Event listener tingkat dokumen untuk rotasi otomatis
      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          lockLandscape();
          setTimeout(lockLandscape, 100);
        } else {
          unlockOrientation();
        }
      });
      document.addEventListener('webkitfullscreenchange', () => {
        if (document.webkitFullscreenElement) {
          lockLandscape();
          setTimeout(lockLandscape, 100);
        } else {
          unlockOrientation();
        }
      });

      // Deteksi klik tombol fullscreen untuk pemicu orientasi instan
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-plyr="fullscreen"]');
        if (btn && (!player || !player.fullscreen || !player.fullscreen.active)) {
          setTimeout(lockLandscape, 50);
          setTimeout(lockLandscape, 200);
        }
      }, true);

      // Khusus iOS / iPhone agar rotasi otomatis aktif via player native
      if (isIOS && videoEl) {
        player.on('enterfullscreen', () => {
          if (typeof videoEl.webkitEnterFullscreen === 'function') {
            videoEl.webkitEnterFullscreen();
          }
        });
        videoEl.addEventListener('webkitendfullscreen', () => {
          unlockOrientation();
          if (player && player.fullscreen && player.fullscreen.active) {
            player.fullscreen.exit();
          }
        });
      }

      // Double Tap Skip 5s
      const videoWrapper = document.querySelector('.video-wrapper');
      if (videoWrapper) {
        videoWrapper.addEventListener('dblclick', (e) => {
          e.preventDefault(); e.stopPropagation();
          const rect = videoWrapper.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          if (clickX < rect.width / 2) player.rewind(5);
          else player.forward(5);
        }, true);
      }

      // ---- RESUME: Simpan posisi video setiap 3 detik ----
      player.on('timeupdate', () => {
        if (resumeThrottleTimer) return;
        resumeThrottleTimer = setTimeout(() => { resumeThrottleTimer = null; }, 3000);

        if (currentAnimeId !== null && currentEpisodeIndex !== null && player.currentTime > 5) {
          const key = `resume_${currentAnimeId}_${currentEpisodeIndex}`;
          localStorage.setItem(key, player.currentTime.toFixed(1));
          // Update continue watching pointer
          localStorage.setItem('cw_animeId', currentAnimeId);
          localStorage.setItem('cw_epIndex', currentEpisodeIndex);
        }
      });

      // ---- AUTO-PLAY NEXT: Saat video selesai ----
      player.on('ended', () => {
        // Hapus resume data karena sudah selesai
        if (currentAnimeId !== null && currentEpisodeIndex !== null) {
          localStorage.removeItem(`resume_${currentAnimeId}_${currentEpisodeIndex}`);
        }

        const anime = ANIME_CATALOG.find(a => a.id === currentAnimeId);
        if (anime && currentEpisodeIndex < anime.episodes.length - 1) {
          startAutoplayCountdown();
        }
      });
    }

    function startStreaming(episodeIndex) {
      currentEpisodeIndex = episodeIndex;
      localStorage.setItem('lastViewedEpisode', episodeIndex);
      localStorage.setItem('currentView', 'view-streaming');
      localStorage.setItem('cw_animeId', currentAnimeId);
      localStorage.setItem('cw_epIndex', episodeIndex);

      cancelAutoplay(); // Cancel any existing countdown

      history.pushState({ view: 'view-streaming', animeId: currentAnimeId, episodeIndex }, '', '#streaming');
      showView('view-streaming');
      
      const anime = ANIME_CATALOG.find(a => a.id === currentAnimeId);
      const ep = anime.episodes[episodeIndex];

      document.getElementById('streaming-title').innerText = `${anime.title} - ${ep.title}`;
      
      const serverContainer = document.getElementById('server-options');
      const serverButtonsDiv = document.getElementById('server-buttons');
      serverButtonsDiv.innerHTML = '';

      if (ep.sources && ep.sources.length > 0) {
        serverContainer.style.display = 'block';
        ep.sources.forEach((src, idx) => {
          const btn = document.createElement('button');
          btn.innerText = src.name;
          btn.className = 'server-btn';
          btn.onclick = () => {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            playSource(src);
          };
          if (idx === 0) btn.classList.add('active');
          serverButtonsDiv.appendChild(btn);
        });
        playSource(ep.sources[0]);
      } else {
        serverContainer.style.display = 'none';
        playSource({ fileId: ep.fileId });
      }

      // Tandai episode ditonton
      const trackId = ep.fileId || (ep.sources && ep.sources[0] ? ep.sources[0].fileId || ep.sources[0].url : null);
      if (trackId) localStorage.setItem(`watched_${trackId}`, 'true');
      
      document.getElementById('btn-prev').style.display = episodeIndex > 0 ? 'block' : 'none';
      document.getElementById('btn-next').style.display = episodeIndex < anime.episodes.length - 1 ? 'block' : 'none';

      // ---- RESUME: Lanjutkan dari posisi terakhir ----
      const resumeKey = `resume_${currentAnimeId}_${episodeIndex}`;
      const savedTime = parseFloat(localStorage.getItem(resumeKey));
      if (savedTime && savedTime > 5) {
        // Tunggu player ready lalu seek
        const onCanPlay = () => {
          player.currentTime = savedTime;
          player.media.removeEventListener('canplay', onCanPlay);
        };
        player.media.addEventListener('canplay', onCanPlay);
      }

      // Show keyboard hints on desktop
      document.getElementById('kbd-hint').classList.add('visible');
    }

    // ==========================================
    // AUTO-PLAY NEXT COUNTDOWN
    // ==========================================
    function startAutoplayCountdown() {
      autoplaySeconds = 5;
      const overlay = document.getElementById('autoplay-overlay');
      const countdownEl = document.getElementById('autoplay-countdown');
      const secEl = document.getElementById('autoplay-sec');

      overlay.classList.add('show');
      countdownEl.textContent = autoplaySeconds;
      secEl.textContent = autoplaySeconds;

      autoplayTimer = setInterval(() => {
        autoplaySeconds--;
        countdownEl.textContent = autoplaySeconds;
        secEl.textContent = autoplaySeconds;

        if (autoplaySeconds <= 0) {
          cancelAutoplay();
          playNextEpisode();
        }
      }, 1000);
    }

    function cancelAutoplay() {
      if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
      const overlay = document.getElementById('autoplay-overlay');
      if (overlay) overlay.classList.remove('show');
    }

    // ==========================================
    // VIEW SWITCHER
    // ==========================================
    function showView(viewId) {
      document.getElementById('view-home').style.display = viewId === 'view-home' ? 'block' : 'none';
      document.getElementById('view-detail').style.display = viewId === 'view-detail' ? 'block' : 'none';
      document.getElementById('view-streaming').style.display = viewId === 'view-streaming' ? 'block' : 'none';
      localStorage.setItem('currentView', viewId);
      window.scrollTo(0, 0);

      // Hide kbd hint when not streaming
      if (viewId !== 'view-streaming') {
        document.getElementById('kbd-hint').classList.remove('visible');
      }
    }

    function navigateToHome() {
      if (player && player.fullscreen && player.fullscreen.active) {
        player.fullscreen.exit();
      }
      unlockOrientation();
      localStorage.removeItem('currentAnimeId');
      localStorage.removeItem('lastViewedEpisode');
      currentAnimeId = null;
      currentEpisodeIndex = null;
      cancelAutoplay();
      history.pushState({ view: 'view-home' }, '', '#');
      showView('view-home');
      renderHome(); // Re-render agar badge progress update
      renderContinueWatching();
      document.getElementById('search-input').value = '';
    }

    function navigateToDetail() {
      if (player && player.fullscreen && player.fullscreen.active) {
        player.fullscreen.exit();
      }
      unlockOrientation();
      localStorage.removeItem('lastViewedEpisode');
      if (player) player.pause();
      cancelAutoplay();
      history.pushState({ view: 'view-detail', animeId: currentAnimeId }, '', '#detail');
      showView('view-detail');
      if (currentAnimeId) renderDetail(currentAnimeId);
    }

    // ==========================================
    // 3. RENDER DETAIL
    // ==========================================
    function renderDetail(animeId) {
      const anime = ANIME_CATALOG.find(a => a.id === animeId);
      const container = document.getElementById('anime-detail-content');
      if (!container || !anime) return;
      
      let episodesHtml = '';
      anime.episodes.forEach((ep, index) => {
        const trackId = ep.fileId || (ep.sources && ep.sources[0] ? ep.sources[0].fileId || ep.sources[0].url : null);
        const isWatched = localStorage.getItem(`watched_${trackId}`) === 'true';
        const btnClass = isWatched ? 'ep-btn watched' : 'ep-btn';
        const iconClass = isWatched ? 'ep-icon check' : 'ep-icon play';
        const iconSymbol = isWatched ? '✓' : '▶';

        episodesHtml += `
          <button class="${btnClass}" onclick="startStreaming(${index})">
            <span class="${iconClass}">${iconSymbol}</span>
            ${ep.title}
          </button>
        `;
      });

      container.innerHTML = `
        <div class="detail-layout">
          <div class="detail-poster-wrap">
            <img class="detail-poster" src="${anime.cover}" alt="${anime.title}">
          </div>
          <div class="detail-info-wrap">
            <h2 class="detail-anime-title">${anime.title}</h2>
            <p class="detail-meta">${anime.meta}</p>
            <div class="episode-list-title">Daftar Episode</div>
            <div class="episode-list-scroll">
              ${episodesHtml || '<p class="ep-no-data">Belum ada episode yang tersedia.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function playPrevEpisode() {
      if (currentEpisodeIndex > 0) startStreaming(currentEpisodeIndex - 1);
    }
    function playNextEpisode() {
      const anime = ANIME_CATALOG.find(a => a.id === currentAnimeId);
      if (anime && currentEpisodeIndex < anime.episodes.length - 1) startStreaming(currentEpisodeIndex + 1);
    }

    // ==========================================
    // 4. KEYBOARD SHORTCUTS
    // ==========================================
    document.addEventListener('keydown', (e) => {
      // Jangan trigger saat mengetik di input search
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      // Hanya aktif saat di halaman streaming
      if (!player || document.getElementById('view-streaming').style.display === 'none') return;

      switch (e.key) {
        case ' ':
          e.preventDefault();
          player.togglePlay();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          player.rewind(5);
          break;
        case 'ArrowRight':
          e.preventDefault();
          player.forward(5);
          break;
        case 'n': case 'N':
          e.preventDefault();
          playNextEpisode();
          break;
        case 'f': case 'F':
          e.preventDefault();
          player.fullscreen.toggle();
          break;
      }
    });

    // ==========================================
    // 5. BROWSER BACK BUTTON (popstate)
    // ==========================================
    window.addEventListener('popstate', function(event) {
      if (player && player.fullscreen && player.fullscreen.active) {
        player.fullscreen.exit();
      }
      unlockOrientation();
      cancelAutoplay();
      const state = event.state;

      if (state && state.view === 'view-streaming' && state.animeId && state.episodeIndex !== undefined) {
        currentAnimeId = state.animeId;
        currentEpisodeIndex = state.episodeIndex;
        showView('view-streaming');
      } else if (state && state.view === 'view-detail' && state.animeId) {
        if (player) player.pause();
        currentAnimeId = state.animeId;
        localStorage.removeItem('lastViewedEpisode');
        showView('view-detail');
        renderDetail(state.animeId);
      } else {
        if (player) player.pause();
        localStorage.removeItem('currentAnimeId');
        localStorage.removeItem('lastViewedEpisode');
        currentAnimeId = null;
        currentEpisodeIndex = null;
        showView('view-home');
        renderHome();
        renderContinueWatching();
      }
    });

    // ==========================================
    // 6. INIT ONLOAD
    // ==========================================
    window.onload = function() {
      renderHome();
      renderContinueWatching();
      history.replaceState({ view: 'view-home' }, '', '#');

      const savedView = localStorage.getItem('currentView');
      const savedAnimeId = localStorage.getItem('currentAnimeId');
      const savedEpisodeIndex = localStorage.getItem('lastViewedEpisode');

      if (savedView === 'view-streaming' && savedAnimeId && savedEpisodeIndex !== null) {
        currentAnimeId = savedAnimeId;
        history.pushState({ view: 'view-detail', animeId: savedAnimeId }, '', '#detail');
        renderDetail(savedAnimeId);
        startStreaming(parseInt(savedEpisodeIndex, 10));
      } else if (savedView === 'view-detail' && savedAnimeId) {
        currentAnimeId = savedAnimeId;
        history.pushState({ view: 'view-detail', animeId: savedAnimeId }, '', '#detail');
        showView('view-detail');
        renderDetail(savedAnimeId);
      } else {
        showView('view-home');
      }
    };
  </script>
</body>
</html>
