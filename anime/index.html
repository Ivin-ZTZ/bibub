<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexlstream</title>
  <link rel="icon" type="image/jpg" href="assets/unnamed.jpg">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Library Plyr Player (CSS & JS) -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

  <style>
    /* ========== TEMA & VARIABEL (MONOCHROME BLUE) ========== */
    :root {
      --bg-color: #090b10;
      --bg-secondary: #0e1117;
      --surface-color: #151922;
      --surface-hover: #1e2430;
      --surface-light: #252d3a;
      --text-main: #e0e4ec;
      --text-muted: #6b7a90;
      --accent: #5b8def;
      --accent-dim: rgba(91, 141, 239, 0.12);
      --accent-glow: rgba(91, 141, 239, 0.25);
      --card-bg: #111720;
      --card-border: rgba(255,255,255,0.05);
      --border-subtle: rgba(255,255,255,0.07);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
      --shadow-elevated: 0 8px 32px rgba(0,0,0,0.6);
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ========== RESET & BASE ========== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle top glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(91,141,239,0.04) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ========== CUSTOM SCROLLBAR ========== */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.18);
    }

    /* ========== HEADER ========== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      padding: 15px 0;
      background: rgba(9, 11, 16, 0.88);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      text-align: center;
      border-bottom: 1px solid rgba(91, 141, 239, 0.15);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    header:hover {
      border-bottom-color: rgba(91, 141, 239, 0.35);
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ========== CONTAINER ========== */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      width: 92%;
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    /* ========== VIEW TRANSITIONS ========== */
    #view-home, #view-detail, #view-streaming {
      animation: fadeSlideIn 0.3s ease-out;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== SECTION TITLE ========== */
    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .section-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* ========== HOME / ANIME GRID ========== */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
      padding: 0;
      margin-top: 8px;
    }

    .anime-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--card-border);
      position: relative;
    }

    .anime-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-md);
      opacity: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(91,141,239,0.06) 100%);
      transition: opacity var(--transition-smooth);
      pointer-events: none;
    }

    .anime-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 35px rgba(0,0,0,0.45), 0 0 15px rgba(91,141,239,0.06);
      border-color: rgba(91, 141, 239, 0.12);
    }

    .anime-card:hover::after {
      opacity: 1;
    }

    .anime-cover-wrapper {
      width: 100%;
      aspect-ratio: 2 / 3;
      position: relative;
      background: #080c14;
      overflow: hidden;
    }

    .anime-cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .anime-card:hover .anime-cover-wrapper img {
      transform: scale(1.06);
    }

    /* Gradient overlay on cover */
    .anime-cover-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 45%;
      background: linear-gradient(to top, var(--card-bg), transparent);
      pointer-events: none;
    }

    .anime-info {
      padding: 11px 13px 13px;
    }

    .anime-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--text-main);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .anime-genre {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ========== MOBILE RESPONSIF ========== */
    @media (max-width: 600px) {
      .container {
        width: 95%;
        padding: 18px 0 36px;
      }

      .anime-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .anime-info {
        padding: 7px 9px 9px;
      }

      .anime-title {
        font-size: 0.72rem;
      }

      .anime-genre {
        font-size: 0.62rem;
      }

      header {
        padding: 11px 0;
      }

      header h1 {
        font-size: 1rem;
        letter-spacing: 3px;
      }

      .section-title {
        font-size: 1.1rem;
      }

      .detail-layout {
        flex-direction: column !important;
        align-items: center;
      }

      .detail-poster-wrap {
        width: 170px !important;
      }

      .detail-info-wrap {
        min-width: unset !important;
      }

      .player-anime-title {
        font-size: 1.1rem !important;
      }

      /* Tombol episode prev/next kecil di HP */
      .player-controls-bottom {
        gap: 8px;
      }

      .player-controls-bottom .btn-action {
        padding: 7px 12px;
        font-size: 0.72rem;
      }
    }

    /* ========== BUTTONS ========== */
    .btn-action {
      background-color: var(--surface-color);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 9px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action:hover:not(:disabled) {
      background-color: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px rgba(91, 141, 239, 0.08);
    }

    .btn-action:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-action:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ========== BACK BUTTON ========== */
    .btn-back {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px 4px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-back:hover {
      color: var(--accent);
    }

    /* ========== PLAYER VIEW ========== */
    .player-nav-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .player-header {
      margin-bottom: 14px;
    }

    .player-anime-title {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-main);
    }

    .video-wrapper {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-elevated);
      background-color: #000;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .plyr,
    .plyr__video-wrapper,
    video {
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    .plyr {
      border-radius: var(--radius-lg);
      width: 100% !important;
    }

    /* Plyr accent color override -> biru */
    .plyr--full-ui input[type=range] {
      color: var(--accent) !important;
    }

    .plyr__control--overlaid {
      background: var(--accent) !important;
      color: #fff !important;
    }

    .plyr__control:hover {
      background: var(--accent) !important;
      color: #fff !important;
    }

    .player-controls-bottom {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ========== SERVER BUTTONS ========== */
    .server-container {
      background-color: var(--surface-color);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }

    .server-label {
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 12px;
    }

    .server-btn {
      background-color: rgba(255,255,255,0.04);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all var(--transition-fast);
    }

    .server-btn:hover {
      background-color: rgba(255,255,255,0.08);
      color: var(--text-main);
      border-color: rgba(255,255,255,0.15);
    }

    .server-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 700;
      box-shadow: 0 0 10px rgba(91,141,239,0.2);
    }

    /* ========== DETAIL PAGE ========== */
    .detail-layout {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .detail-poster-wrap {
      width: 210px;
      flex-shrink: 0;
    }

    .detail-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-subtle);
    }

    .detail-info-wrap {
      flex: 1;
      min-width: 270px;
    }

    .detail-anime-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 6px;
      line-height: 1.2;
      color: var(--text-main);
    }

    .detail-meta {
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 22px;
      opacity: 0.85;
    }

    .episode-list-title {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .episode-list-scroll {
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Episode Button */
    .ep-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 5px;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: left;
    }

    .ep-btn:hover {
      background: var(--accent-dim);
      border-color: rgba(91, 141, 239, 0.2);
      color: var(--accent);
    }

    .ep-btn.watched {
      color: var(--text-muted);
      opacity: 0.5;
      font-weight: 500;
    }

    .ep-btn.watched:hover {
      opacity: 0.75;
    }

    .ep-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
    }

    .ep-icon.play {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .ep-icon.check {
      background: rgba(107, 122, 144, 0.15);
      color: var(--text-muted);
    }

    .ep-no-data {
      color: var(--text-muted);
      font-style: italic;
      padding: 14px 0;
    }
  </style>
</head>
<body>

  <header onclick="navigateToHome()">
    <h1>Vexlstream</h1>
  </header>

  <div class="container">
    
    <!-- 1. HALAMAN HOME / KATALOG -->
    <div id="view-home">
      <div class="section-title">Koleksi Anime</div>
      <div class="section-subtitle">Pilih judul untuk melihat daftar episode</div>
      <div class="anime-grid" id="anime-list-container"></div>
    </div>

    <!-- 2. HALAMAN DETAIL ANIME -->
    <div id="view-detail" style="display: none;">
      <div class="player-nav-top">
        <button class="btn-back" onclick="navigateToHome()">← Kembali ke Menu</button>
      </div>
      <div id="anime-detail-content" style="margin-top: 10px;"></div>
    </div>

    <!-- 3. HALAMAN STREAMING VIDEO -->
    <div id="view-streaming" style="display: none;">
      <div class="player-nav-top">
        <button class="btn-back" onclick="navigateToDetail()">← Kembali ke Detail Anime</button>
      </div>
      
      <div class="player-header">
        <div id="streaming-title" class="player-anime-title">Nama Anime - Nama Episode</div>
      </div>

      <div class="video-wrapper">
        <video id="main-player" controls playsinline preload="metadata"></video>
      </div>

      <div class="player-controls-bottom">
        <button id="btn-prev" class="btn-action" onclick="playPrevEpisode()">⏮ Sebelumnya</button>
        <button id="btn-next" class="btn-action" onclick="playNextEpisode()">Selanjutnya ⏭</button>
      </div>

      <!-- Container Tombol Pilihan Server -->
      <div id="server-options" class="server-container" style="display: none; margin-top: 15px;">
        <span class="server-label">Pilih Server / Kualitas:</span>
        <div id="server-buttons" style="display: inline-flex; gap: 8px; flex-wrap: wrap;"></div>
      </div>

    </div>

  </div>

  <!-- Panggil File Data Katalog -->
  <script src="catalog.js"></script>
  
  <script>
    // ==========================================
    // VARIABEL GLOBAL UNTUK TRACKING EPISODE
    // ==========================================
    let currentAnimeId = null;
    let currentEpisodeIndex = null;
    let player = null; // Instance Plyr
    let isNavigating = false; // Flag agar pushState tidak konflik dengan popstate

    // ==========================================
    // 1. FUNGSI RENDER MENU UTAMA (HOME)
    // ==========================================
    function renderHome() {
      const container = document.getElementById('anime-list-container');
      if (!container) return;
      container.innerHTML = '';

      ANIME_CATALOG.forEach(anime => {
        container.innerHTML += `
          <div class="anime-card" onclick="selectAnime('${anime.id}')">
            <div class="anime-cover-wrapper">
              <img src="${anime.cover}" alt="${anime.title}" loading="lazy">
            </div>
            <div class="anime-info">
              <div class="anime-title">${anime.title}</div>
              <span class="anime-genre">${anime.meta.split('•')[0]}</span>
            </div>
          </div>
        `;
      });
    }

    // ==========================================
    // 2. FUNGSI NAVIGASI & STREAMING
    // ==========================================
    function selectAnime(animeId) {
      currentAnimeId = animeId;
      localStorage.setItem('currentAnimeId', animeId);
      localStorage.removeItem('lastViewedEpisode');
      
      // Push state ke browser history agar tombol back HP bekerja
      history.pushState({ view: 'view-detail', animeId: animeId }, '', '#detail');
      
      showView('view-detail');
      renderDetail(animeId);
    }

    function playSource(source) {
      let streamUrl = "";

      if (source.fileId) {
        streamUrl = `/api/stream?fileId=${source.fileId}`;
      } else if (source.url) {
        streamUrl = source.url;
      }

      if (!player) {
        initPlyr();
      }

      player.source = {
        type: 'video',
        sources: [{ src: streamUrl, type: 'video/mp4' }]
      };

      player.play().catch(err => console.log("Autoplay dicegah browser:", err));
    }

    function initPlyr() {
      player = new Plyr('#main-player', {
        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'settings', 'pip', 'fullscreen'],
        seekTime: 5,
        clickToPlay: true,
        doubleClickDelay: 0,
        fullscreen: { enabled: true, fallback: true, iosNative: true }
      });

      // Fitur Double Tap Skip 5 Detik
      const videoWrapper = document.querySelector('.video-wrapper');
      if (videoWrapper) {
        videoWrapper.addEventListener('dblclick', (e) => {
          e.preventDefault();
          e.stopPropagation();

          const rect = videoWrapper.getBoundingClientRect();
          const clickX = e.clientX - rect.left;

          if (clickX < rect.width / 2) {
            player.rewind(5);
          } else {
            player.forward(5);
          }
        }, true);
      }
    }

    function startStreaming(episodeIndex) {
      currentEpisodeIndex = episodeIndex;
      localStorage.setItem('lastViewedEpisode', episodeIndex);
      localStorage.setItem('currentView', 'view-streaming');
      
      // Push state ke browser history agar tombol back HP bekerja
      history.pushState({ view: 'view-streaming', animeId: currentAnimeId, episodeIndex: episodeIndex }, '', '#streaming');
      
      showView('view-streaming');
      
      const anime = ANIME_CATALOG.find(a => a.id === currentAnimeId);
      const ep = anime.episodes[episodeIndex];

      document.getElementById('streaming-title').innerText = `${anime.title} - ${ep.title}`;
      
      const serverContainer = document.getElementById('server-options');
      const serverButtonsDiv = document.getElementById('server-buttons');
      serverButtonsDiv.innerHTML = '';

      // CEK TERDAPAT MULTIPLE SERVER ATAU FILE ID TUNGGAL
      if (ep.sources && ep.sources.length > 0) {
        serverContainer.style.display = 'block';

        ep.sources.forEach((src, idx) => {
          const btn = document.createElement('button');
          btn.innerText = src.name;
          btn.className = 'server-btn';
          btn.onclick = () => {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            playSource(src);
          };

          if (idx === 0) btn.classList.add('active');
          serverButtonsDiv.appendChild(btn);
        });

        playSource(ep.sources[0]);
      } else {
        serverContainer.style.display = 'none';
        playSource({ fileId: ep.fileId });
      }

      // Tandai episode pernah ditonton
      const trackId = ep.fileId || (ep.sources && ep.sources[0] ? ep.sources[0].fileId || ep.sources[0].url : null);
      if (trackId) localStorage.setItem(`watched_${trackId}`, 'true');
      
      document.getElementById('btn-prev').style.display = episodeIndex > 0 ? 'block' : 'none';
      document.getElementById('btn-next').style.display = episodeIndex < anime.episodes.length - 1 ? 'block' : 'none';
    }

    function showView(viewId) {
      document.getElementById('view-home').style.display = viewId === 'view-home' ? 'block' : 'none';
      document.getElementById('view-detail').style.display = viewId === 'view-detail' ? 'block' : 'none';
      document.getElementById('view-streaming').style.display = viewId === 'view-streaming' ? 'block' : 'none';
      
      localStorage.setItem('currentView', viewId);
      window.scrollTo(0, 0);
    }

    function navigateToHome() {
      localStorage.removeItem('currentAnimeId');
      localStorage.removeItem('lastViewedEpisode');
      
      currentAnimeId = null;
      currentEpisodeIndex = null;
      
      // Push state home
      history.pushState({ view: 'view-home' }, '', '#');
      
      showView('view-home');
    }

    function navigateToDetail() {
      localStorage.removeItem('lastViewedEpisode');
      if (player) player.pause();
      
      // Push state detail
      history.pushState({ view: 'view-detail', animeId: currentAnimeId }, '', '#detail');
      
      showView('view-detail');
      if (currentAnimeId) renderDetail(currentAnimeId);
    }

    // ==========================================
    // 3. RENDER DETAIL ANIME
    // ==========================================
    function renderDetail(animeId) {
      const anime = ANIME_CATALOG.find(a => a.id === animeId);
      const container = document.getElementById('anime-detail-content');
      if (!container || !anime) return;
      
      let episodesHtml = '';
      anime.episodes.forEach((ep, index) => {
        const trackId = ep.fileId || (ep.sources && ep.sources[0] ? ep.sources[0].fileId || ep.sources[0].url : null);
        const isWatched = localStorage.getItem(`watched_${trackId}`) === 'true';
        
        const btnClass = isWatched ? 'ep-btn watched' : 'ep-btn';
        const iconClass = isWatched ? 'ep-icon check' : 'ep-icon play';
        const iconSymbol = isWatched ? '✓' : '▶';

        episodesHtml += `
          <button class="${btnClass}" onclick="startStreaming(${index})">
            <span class="${iconClass}">${iconSymbol}</span>
            ${ep.title}
          </button>
        `;
      });

      container.innerHTML = `
        <div class="detail-layout">
          <div class="detail-poster-wrap">
            <img class="detail-poster" src="${anime.cover}" alt="${anime.title}">
          </div>
          <div class="detail-info-wrap">
            <h2 class="detail-anime-title">${anime.title}</h2>
            <p class="detail-meta">${anime.meta}</p>
            <div class="episode-list-title">Daftar Episode</div>
            <div class="episode-list-scroll">
              ${episodesHtml || '<p class="ep-no-data">Belum ada episode yang tersedia.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function playPrevEpisode() {
      if (currentEpisodeIndex > 0) startStreaming(currentEpisodeIndex - 1);
    }

    function playNextEpisode() {
      const anime = ANIME_CATALOG.find(a => a.id === currentAnimeId);
      if (anime && currentEpisodeIndex < anime.episodes.length - 1) startStreaming(currentEpisodeIndex + 1);
    }

    // ==========================================
    // 4. BROWSER BACK BUTTON HANDLER (popstate)
    // ==========================================
    window.addEventListener('popstate', function(event) {
      const state = event.state;

      if (state && state.view === 'view-streaming' && state.animeId && state.episodeIndex !== undefined) {
        // Kembali ke streaming
        currentAnimeId = state.animeId;
        currentEpisodeIndex = state.episodeIndex;
        showView('view-streaming');
      } else if (state && state.view === 'view-detail' && state.animeId) {
        // Kembali ke detail anime
        if (player) player.pause();
        currentAnimeId = state.animeId;
        localStorage.removeItem('lastViewedEpisode');
        showView('view-detail');
        renderDetail(state.animeId);
      } else {
        // Kembali ke home
        if (player) player.pause();
        localStorage.removeItem('currentAnimeId');
        localStorage.removeItem('lastViewedEpisode');
        currentAnimeId = null;
        currentEpisodeIndex = null;
        showView('view-home');
      }
    });

    // ==========================================
    // 5. INISIALISASI ONLOAD
    // ==========================================
    window.onload = function() {
      renderHome();

      // Set initial state di history
      history.replaceState({ view: 'view-home' }, '', '#');

      const savedView = localStorage.getItem('currentView');
      const savedAnimeId = localStorage.getItem('currentAnimeId');
      const savedEpisodeIndex = localStorage.getItem('lastViewedEpisode');

      if (savedView === 'view-streaming' && savedAnimeId && savedEpisodeIndex !== null) {
        currentAnimeId = savedAnimeId;
        history.pushState({ view: 'view-detail', animeId: savedAnimeId }, '', '#detail');
        renderDetail(savedAnimeId);
        startStreaming(parseInt(savedEpisodeIndex, 10));
      } else if (savedView === 'view-detail' && savedAnimeId) {
        currentAnimeId = savedAnimeId;
        history.pushState({ view: 'view-detail', animeId: savedAnimeId }, '', '#detail');
        showView('view-detail');
        renderDetail(savedAnimeId);
      } else {
        showView('view-home');
      }
    };
  </script>
</body>
</html>
