<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexlstream</title>
  <link rel="icon" type="image/jpg" href="assets/unnamed.jpg">
  
  <!-- Library Plyr Player (CSS & JS) -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

  <style>
    /* Tema Gelap (Dark Theme) */
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --surface-hover: #2a2a2a;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #ffcc00; 
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 20px 0;
      background-color: var(--surface-color);
      text-align: center;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .container {
      max-width: 1100px;
      width: 90%;
      margin: 40px auto;
    }

    /* --- GAYA HOME MENU --- */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
    }
  
    .anime-card {
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
    }

    .anime-card:hover {
      transform: scale(1.05);
    }

    .anime-cover-wrapper {
      width: 100%;
      aspect-ratio: 2 / 3;
      position: relative;
      background: #0f172a;
    }

    .anime-cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .anime-info {
      padding: 12px;
    }

    .anime-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #fff;
    }

    /* Khusus Tampilan Layar HP */
    @media (max-width: 600px) {
      .anime-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 10px;
      }
      
      .anime-info {
        padding: 6px;
      }
      
      .anime-title {
        font-size: 12px;
      }
      
      header h1 {
        font-size: 1.2rem;
      }
    }

    /* --- GAYA PLAYER VIEW --- */
    .player-nav-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-action {
      background-color: var(--surface-color);
      color: var(--text-main);
      border: 1px solid var(--text-muted);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-action:hover:not(:disabled) {
      background-color: var(--surface-hover);
      border-color: var(--accent);
    }

    .player-header {
      margin-bottom: 20px;
    }

    .player-anime-title {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .video-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      background-color: #000;
    }

    .plyr, 
    .plyr__video-wrapper, 
    video {
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    .plyr {
      border-radius: 12px;
      width: 100% !important;
    }

    .player-controls-bottom {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    /* GAYA TOMBOL SERVER */
    .server-container {
      background-color: var(--surface-color);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .server-btn {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .server-btn:hover {
      background-color: #444;
    }

    .server-btn.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header onclick="navigateToHome()">
    <h1>Vexlstream</h1>
  </header>

  <div class="container">
    
    <!-- 1. HALAMAN HOME / KATALOG -->
    <div id="view-home">
      <h2 style="margin-bottom: 10px;">Koleksi Anime</h2>
      <div class="anime-grid" id="anime-list-container"></div>
    </div>

    <!-- 2. HALAMAN DETAIL ANIME -->
    <div id="view-detail" style="display: none;">
      <div class="player-nav-top">
        <button class="btn-action" onclick="navigateToHome()">← Kembali ke Menu</button>
      </div>
      <div id="anime-detail-content" style="margin-top: 20px;"></div>
    </div>

    <!-- 3. HALAMAN STREAMING VIDEO -->
    <div id="view-streaming" style="display: none;">
      <div class="player-nav-top">
        <button class="btn-action" onclick="navigateToDetail()">← Kembali ke Detail Anime</button>
      </div>
      
      <div class="player-header">
        <div id="streaming-title" class="player-anime-title">Nama Anime - Nama Episode</div>
      </div>

      <div class="video-wrapper">
        <video id="main-player" controls playsinline preload="metadata"></video>
      </div>

      <div class="player-controls-bottom">
        <button id="btn-prev" class="btn-action" onclick="playPrevEpisode()">⏮ Episode Sebelumnya</button>
        <button id="btn-next" class="btn-action" onclick="playNextEpisode()">Episode Selanjutnya ⏭</button>
      </div>

      <!-- Container Tombol Pilihan Server -->
      <div id="server-options" class="server-container" style="display: none; margin-top: 15px;">
        <span style="font-weight: bold; margin-right: 10px;">Pilih Server / Kualitas:</span>
        <div id="server-buttons" style="display: inline-flex; gap: 8px; flex-wrap: wrap;"></div>
      </div>
      
    </div>

  </div>

  <!-- Panggil File Data Katalog -->
  <script src="catalog.js"></script>
  
  <script>
    // ==========================================
    // VARIABEL GLOBAL UNTUK TRACKING EPISODE
    // ==========================================
    let currentAnimeId = null;
    let currentEpisodeIndex = null;
    let player = null; // Instance Plyr

    // ==========================================
    // 1. FUNGSI RENDER MENU UTAMA (HOME)
    // ==========================================
    function renderHome() {
      const container = document.getElementById('anime-list-container');
      if (!container) return;
      container.innerHTML = '';

      ANIME_CATALOG.forEach(anime => {
        container.innerHTML += `
          <div class="anime-card" onclick="selectAnime('${anime.id}')">
            <div class="anime-cover-wrapper">
              <img src="${anime.cover}" alt="${anime.title}">
            </div>
            <div class="anime-info">
              <div class="anime-title">${anime.title}</div>
              <small style="color: #94a3b8;">${anime.meta.split('•')[0]}</small>
            </div>
          </div>
        `;
      });
    }

    // ==========================================
    // 2. FUNGSI NAVIGASI & STREAMING
    // ==========================================
    function selectAnime(animeId) {
      currentAnimeId = animeId;
      localStorage.setItem('currentAnimeId', animeId);
      localStorage.removeItem('lastViewedEpisode');
      
      showView('view-detail');
      renderDetail(animeId);
    }

    function playSource(source) {
      let streamUrl = "";

      if (source.fileId) {
        streamUrl = `/api/stream?fileId=${source.fileId}`;
      } else if (source.url) {
        streamUrl = source.url;
      }

      if (!player) {
        initPlyr();
      }

      player.source = {
        type: 'video',
        sources: [{ src: streamUrl, type: 'video/mp4' }]
      };

      player.play().catch(err => console.log("Autoplay dicegah browser:", err));
    }

    function initPlyr() {
      player = new Plyr('#main-player', {
        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'settings', 'pip', 'fullscreen'],
        seekTime: 5,
        clickToPlay: true
      });

      // 1. BLOKIR DOUBLE TAP NATIVE & CEK DOUBLE CLICK UNTUK SKIP 5 DETIK
      const videoContainer = document.querySelector('.video-wrapper');
      
      if (videoContainer) {
        // Cegah gesture double tap bawaan browser HP agar tidak fullscreen
        videoContainer.addEventListener('dblclick', (e) => {
          e.preventDefault();
          e.stopPropagation();

          // Hitung posisi ketukan (Kiri = Mundur 5s, Kanan = Maju 5s)
          const rect = videoContainer.getBoundingClientRect();
          const clickX = e.clientX - rect.left;

          if (player) {
            if (clickX < rect.width / 2) {
              player.rewind(5); // Sisi KIRI: Mundur 5 detik
            } else {
              player.forward(5); // Sisi KANAN: Maju 5 detik
            }
          }
        }, true);
      }

      // 2. KUNCI ROTASI LANDSCAPE SAAT ENTER FULLSCREEN (TETAP AKTIF)
      player.on('enterfullscreen', () => {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      });

      player.on('exitfullscreen', () => {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      });
    }

    function startStreaming(episodeIndex) {
      currentEpisodeIndex = episodeIndex;
      localStorage.setItem('lastViewedEpisode', episodeIndex);
      localStorage.setItem('currentView', 'view-streaming');
      
      showView('view-streaming');
      
      const anime = ANIME_CATALOG.find(a => a.id === currentAnimeId);
      const ep = anime.episodes[episodeIndex];

      document.getElementById('streaming-title').innerText = `${anime.title} - ${ep.title}`;
      
      const serverContainer = document.getElementById('server-options');
      const serverButtonsDiv = document.getElementById('server-buttons');
      serverButtonsDiv.innerHTML = '';

      // CEK TERDAPAT MULTIPLE SERVER ATAU FILE ID TUNGGAL
      if (ep.sources && ep.sources.length > 0) {
        serverContainer.style.display = 'block';

        ep.sources.forEach((src, idx) => {
          const btn = document.createElement('button');
          btn.innerText = src.name;
          btn.className = 'server-btn';
          btn.onclick = () => {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            playSource(src);
          };

          if (idx === 0) btn.classList.add('active');
          serverButtonsDiv.appendChild(btn);
        });

        playSource(ep.sources[0]);
      } else {
        serverContainer.style.display = 'none';
        playSource({ fileId: ep.fileId });
      }

      // Tandai episode pernah ditonton
      const trackId = ep.fileId || (ep.sources && ep.sources[0] ? ep.sources[0].fileId || ep.sources[0].url : null);
      if (trackId) localStorage.setItem(`watched_${trackId}`, 'true');
      
      document.getElementById('btn-prev').style.display = episodeIndex > 0 ? 'block' : 'none';
      document.getElementById('btn-next').style.display = episodeIndex < anime.episodes.length - 1 ? 'block' : 'none';
    }

    function showView(viewId) {
      document.getElementById('view-home').style.display = viewId === 'view-home' ? 'block' : 'none';
      document.getElementById('view-detail').style.display = viewId === 'view-detail' ? 'block' : 'none';
      document.getElementById('view-streaming').style.display = viewId === 'view-streaming' ? 'block' : 'none';
      
      localStorage.setItem('currentView', viewId);
    }

    function navigateToHome() {
      localStorage.removeItem('currentAnimeId');
      localStorage.removeItem('lastViewedEpisode');
      
      currentAnimeId = null;
      currentEpisodeIndex = null;
      showView('view-home');
    }

    function navigateToDetail() {
      localStorage.removeItem('lastViewedEpisode');
      if (player) player.pause();
      
      showView('view-detail');
      if (currentAnimeId) renderDetail(currentAnimeId);
    }

    // ==========================================
    // 3. RENDER DETAIL ANIME
    // ==========================================
    function renderDetail(animeId) {
      const anime = ANIME_CATALOG.find(a => a.id === animeId);
      const container = document.getElementById('anime-detail-content');
      if (!container || !anime) return;
      
      let episodesHtml = '';
      anime.episodes.forEach((ep, index) => {
        const trackId = ep.fileId || (ep.sources && ep.sources[0] ? ep.sources[0].fileId || ep.sources[0].url : null);
        const isWatched = localStorage.getItem(`watched_${trackId}`) === 'true';
        
        const textStyle = isWatched 
          ? 'color: #64748b; opacity: 0.7; font-weight: normal;' 
          : 'color: #ffffff; font-weight: bold;';
        const prefix = isWatched ? '✓ ' : '▶ ';

        episodesHtml += `
          <button class="btn-action" 
                  style="margin: 5px 0; text-align: left; width: 100%; display: block; ${textStyle}" 
                  onclick="startStreaming(${index})">
            ${prefix}${ep.title}
          </button>
        `;
      });

      container.innerHTML = `
        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
          <div style="width: 240px; aspect-ratio: 2/3;">
            <img src="${anime.cover}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
          </div>
          <div style="flex: 1; min-width: 300px;">
            <h2>${anime.title}</h2>
            <p style="color: #e0b12d; margin-bottom: 20px;">${anime.meta}</p>
            <h3>Daftar Episode / Putar:</h3>
            <div style="max-height: 400px; overflow-y: auto; margin-top: 10px; padding-right: 5px;">
              ${episodesHtml || '<p style="color:#94a3b8;">Belum ada episode yang tersedia.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function playPrevEpisode() {
      if (currentEpisodeIndex > 0) startStreaming(currentEpisodeIndex - 1);
    }

    function playNextEpisode() {
      const anime = ANIME_CATALOG.find(a => a.id === currentAnimeId);
      if (anime && currentEpisodeIndex < anime.episodes.length - 1) startStreaming(currentEpisodeIndex + 1);
    }

    // ==========================================
    // 4. INSIALISASI ONLOAD
    // ==========================================
    window.onload = function() {
      renderHome();

      const savedView = localStorage.getItem('currentView');
      const savedAnimeId = localStorage.getItem('currentAnimeId');
      const savedEpisodeIndex = localStorage.getItem('lastViewedEpisode');

      if (savedView === 'view-streaming' && savedAnimeId && savedEpisodeIndex !== null) {
        currentAnimeId = savedAnimeId;
        renderDetail(savedAnimeId);
        startStreaming(parseInt(savedEpisodeIndex, 10));
      } else if (savedView === 'view-detail' && savedAnimeId) {
        currentAnimeId = savedAnimeId;
        showView('view-detail');
        renderDetail(savedAnimeId);
      } else {
        showView('view-home');
      }
    };
  </script>
</body>
</html>
